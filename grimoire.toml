# Grimoire book configuration for the @deckyard/routeros documentation.

[book]
title = "@deckyard/routeros"
description = "A thick, friendly layer over the MikroTik RouterOS API for Jennifer."
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "ivy"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-routeros/"
logo = "deckyard.svg"
favicon = "deckyard.svg"
repoUrl = "https://github.com/deckyard/deck-routeros"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-routeros/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
